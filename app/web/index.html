<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Codex</title>
<meta name="description" content="Codex: a calm offline reader for codex film. Search and read millions of distilled reference pages with nothing leaving the machine.">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/codex.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
<symbol id="i-fwd" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5.5h4V20"/></symbol>
<symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 0 4 23z"/><path d="M4 5.5v15"/></symbol>
<symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10.5 13.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="i-package" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
</defs></svg>

<div class="app" id="app">
  <div class="scroll" id="scroll"><div id="view"></div></div>
  <div class="topfade"></div><div class="botfade"></div>

  <header class="top" id="top">
    <button class="brand" id="bBrand" aria-label="Home">Codex</button>
    <nav class="menubar" id="menubar">
      <button class="mb" data-m="file" aria-haspopup="true" aria-expanded="false">File</button>
      <button class="mb" data-m="edit" aria-haspopup="true" aria-expanded="false">Edit</button>
      <button class="mb" data-m="view" aria-haspopup="true" aria-expanded="false">View</button>
      <button class="mb" data-m="go" aria-haspopup="true" aria-expanded="false">Go</button>
      <button class="mb ham" data-m="all" aria-haspopup="true" aria-expanded="false" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </nav>
    <div class="pl">
      <button class="ib" id="bBack" aria-label="Back" disabled><svg class="i"><use href="#i-back"/></svg></button>
      <button class="ib fwd" id="bFwd" aria-label="Forward" disabled><svg class="i"><use href="#i-fwd"/></svg></button>
    </div>
    <label class="sf" id="sf">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="text" placeholder="Search your library" autocomplete="off" spellcheck="false" aria-label="Search">
      <kbd id="qk">/</kbd>
    </label>
    <div class="pr">
      <button class="ib sec" id="bHome" aria-label="Home"><svg class="i"><use href="#i-home"/></svg></button>
      <button class="ib sec" id="bMark" aria-label="Save article" disabled><svg class="i"><use href="#i-mark"/></svg></button>
      <button class="ib" id="bToc" aria-label="Contents"><svg class="i"><use href="#i-list"/></svg></button>
    </div>
    <div class="sp" id="sp" role="listbox"></div>
  </header>

  <div class="find" id="find">
    <svg class="i" style="width:15px;height:15px;color:var(--mute)"><use href="#i-search"/></svg>
    <input id="findIn" placeholder="Find in article" aria-label="Find in article">
    <span class="fc" id="findCt"></span>
    <button class="ib" id="findPrev" aria-label="Previous match"><svg class="i"><use href="#i-up"/></svg></button>
    <button class="ib" id="findNext" aria-label="Next match"><svg class="i"><use href="#i-down"/></svg></button>
    <button class="ib" id="findX" aria-label="Close find"><svg class="i"><use href="#i-x"/></svg></button>
  </div>

  <aside class="sheet" id="sheet" aria-label="Side panel">
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="toc">Contents</button>
      <button class="tab" data-t="marks">Saved</button>
      <button class="tab" data-t="hist">History</button>
      <button class="ib sx" id="sheetX" aria-label="Close panel" style="width:28px;height:28px"><svg class="i" style="width:15px;height:15px"><use href="#i-x"/></svg></button>
    </div>
    <div class="sl" id="sl"></div>
  </aside>

    <div class="toast" id="toast" role="status"></div>
    <div class="scrim" id="scrim"><div class="dlg" id="dlg"></div></div>
    <!-- Kept for app/launcher.py (Windows hotkey overlay), which toggles
         this node's textContent between quick and deep. Invisible here. -->
    <button id="mode" class="hide" aria-hidden="true" tabindex="-1">quick</button>
  </div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
